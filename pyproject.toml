[project]
name = "curso-google-adk-2"
version = "1.0.0"
description = "Curso profesional de Google ADK 2.0 y agents-cli: Desde Single-Agent hasta Multi-Agent con modelos locales (Ollama, LM Studio, MLX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
